name: Build unsigned iPhone IPA
on:
  workflow_dispatch:
    inputs:
      runner:
        description: Standard macOS runner (Intel is an alternative when ARM runners are queued)
        type: choice
        default: macos-15
        options:
          - macos-15
          - macos-15-intel
permissions:
  contents: read
concurrency:
  group: unsigned-ipa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ${{ inputs.runner || 'macos-15' }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Verify geometry conversion on synthetic models
        run: |
          set -o pipefail
          mkdir -p build/logs
          python3 tests/make_usdz_fixture.py
          xcrun --sdk macosx swiftc JRScan/OBJExporter.swift JRScan/ReconstructionFailure.swift tests/GeometryChecks.swift -o build/geometry-checks
          build/geometry-checks build/geometry-fixture.usdz | tee build/logs/geometry-tests.txt
      - name: Build and package device IPA (no signing)
        run: bash scripts/build-ipa.sh
      - name: Upload IPA and build information
        uses: actions/upload-artifact@v4
        with:
          name: JRScan-unsigned-${{ github.run_number }}
          path: |
            build/JRScan.ipa
            build/build-info.txt
          if-no-files-found: error
          retention-days: 7
      - name: Upload diagnostic build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: JRScan-build-logs-${{ github.run_number }}
          path: build/logs/
          if-no-files-found: warn
          retention-days: 7
